name: Release

# Maintained in the private source repository and published here by its
# release sync together with the rest of .github/; edit it there, not here.
# The release sync pushes a vMAJOR.MINOR.PATCH tag, which builds the server
# binary for every supported platform and attaches the archives, SHA256SUMS
# and build provenance attestations to the GitHub Release for the tag. Tests
# run in the private CI before a release is tagged; this workflow only builds,
# so that the build of every published binary is publicly visible.
#
# Only a tag push (which needs write access) may start this workflow, the
# build jobs get a read-only token and run on GitHub-hosted runners only, and
# every job is limited to GitHub so that the private source, which tracks this
# file, never runs it. The private source checks these rules on every change.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A re-pushed tag re-runs this; let a fresh run supersede an in-flight one
# without cancelling (avoid a half-uploaded release).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# `shell: bash` makes every step run as `bash -e -o pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  BINARY: issue-tracker-server

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are fully static (musl), so they run on any
          # distribution without a glibc floor. Each is built natively on its
          # architecture so the artifact check can run it. cc-rs looks for a
          # target-prefixed musl compiler that Ubuntu's musl-tools does not
          # ship for aarch64, so the bundled SQLite compiler is named
          # explicitly.
          - name: linux-x86_64
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extra_env: CC_x86_64_unknown_linux_musl=musl-gcc
          - name: linux-aarch64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extra_env: CC_aarch64_unknown_linux_musl=musl-gcc
          # 11.0 is the oldest macOS Rust supports on Apple Silicon.
          - name: darwin-arm64
            runs_on: macos-15
            target: aarch64-apple-darwin
            extra_env: MACOSX_DEPLOYMENT_TARGET=11.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export platform settings
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          for kv in ${EXTRA_ENV}; do
            echo "${kv}" >>"${GITHUB_ENV}"
          done

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install protoc
        run: bash scripts/install-protoc.sh "${RUNNER_TEMP}/protoc"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No Rust cache: GitHub scopes caches to the ref, and a tag-only
      # workflow can never restore what a previous tag saved.
      - name: Show build environment
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then
            sw_vers
            xcrun --show-sdk-version || true
          else
            grep -E '^(NAME|VERSION)=' /etc/os-release
            musl-gcc --version | head -n 1
          fi
          rustc --version --verbose
          "${PROTOC}" --version
          echo "platform settings: ${EXTRA_ENV}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}" -p issue-tracker-front --bin "${BINARY}"

      # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble (._*) files.
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
          # The matrix name is the platform verify-server-artifact.sh checks.
          PLATFORM: ${{ matrix.name }}
          COPYFILE_DISABLE: '1'
        run: |
          built="target/${TARGET}/release/${BINARY}"
          bash scripts/verify-server-artifact.sh "${built}" "${PLATFORM}" "${GITHUB_REF_NAME#v}"
          stage="${BINARY}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp "${built}" LICENSE README.md README_ja.md "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          rm -rf "dist/${stage:?}"
          ls -l dist

      # Stored uncompressed: the archive is already gzip-compressed.
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The only job holding a write token, and the one that signs the provenance
  # of what the build jobs produced.
  publish:
    name: Publish GitHub Release
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          ls -l dist
          (cd dist && sha256sum -- *.tar.gz >SHA256SUMS && cat SHA256SUMS)
          # The release sync commit lists the changes since the previous release.
          git log -1 --format=%B >release-notes.md
          cat release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
