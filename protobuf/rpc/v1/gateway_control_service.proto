syntax = "proto3";

package issue_tracker.rpc.v1;

import "manager/v1/issue_tracker_manager_methods.proto";

// Control-plane API. It is exposed only from an endpoint whose configured
// identity determines the Gateway; callers cannot supply a Gateway ID.
service GatewayControlService {
  rpc RegisterGateway(issue_tracker.manager.v1.RegisterGatewayArgs) returns (issue_tracker.manager.v1.RegisterGatewayResult);
  rpc GetGatewayRegistration(issue_tracker.manager.v1.GetGatewayRegistrationArgs) returns (issue_tracker.manager.v1.GetGatewayRegistrationResult);
}
