syntax = "proto3";
package issue_tracker.rpc.v1;
import "manager/v1/issue_tracker_manager_methods.proto";
service CandidateService {
  rpc CreateCandidate(issue_tracker.manager.v1.CreateCandidateArgs) returns (issue_tracker.manager.v1.CreateCandidateResult);
  rpc GetCandidate(issue_tracker.manager.v1.GetCandidateArgs) returns (issue_tracker.manager.v1.GetCandidateResult);
  rpc ListCandidates(issue_tracker.manager.v1.ListCandidatesArgs) returns (issue_tracker.manager.v1.ListCandidatesResult);
  rpc UpdateCandidate(issue_tracker.manager.v1.UpdateCandidateArgs) returns (issue_tracker.manager.v1.UpdateCandidateResult);
  rpc ResolveCandidate(issue_tracker.manager.v1.ResolveCandidateArgs) returns (issue_tracker.manager.v1.ResolveCandidateResult);
}
